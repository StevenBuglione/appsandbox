[workspace]
members = [
    "crates/asb-domain",
    "crates/asb-protocol",
    "crates/asb-application",
    "crates/asb-windows",
    "crates/asb-display-win",
    "crates/asb-headless",
    "crates/asb-runtime",
    "crates/asb-linux-agent",
    "crates/asb-linux-input",
    "crates/asb-mutter-resize",
    "xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.4"
edition = "2024"
license = "MIT"
repository = "https://github.com/StevenBuglione/appsandbox"
rust-version = "1.93"

[workspace.lints.rust]
missing_docs = "deny"
unreachable_pub = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
enum_glob_use = "deny"
excessive_nesting = "deny"
expect_used = "deny"
fn_params_excessive_bools = "deny"
large_types_passed_by_value = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
missing_safety_doc = "deny"
multiple_unsafe_ops_per_block = "deny"
needless_pass_by_value = "deny"
panic = "deny"
struct_excessive_bools = "deny"
todo = "deny"
too_many_arguments = "deny"
too_many_lines = "deny"
trivially_copy_pass_by_ref = "deny"
type_complexity = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unnecessary_wraps = "deny"
unwrap_used = "deny"
wildcard_imports = "deny"
